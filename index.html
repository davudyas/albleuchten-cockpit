<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Albleuchten Import-Cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&display=swap">
<style>
/* Token-System: RAL-Farben aus der Industrie, IBM Plex als technische Schrift */
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","Arial Narrow","IBM Plex Sans",system-ui,sans-serif;
  --ink:#1F2A33; --ink2:#55616B; --ink3:#86919A;
  --line:#D9DFE4; --line2:#ECEFF2; --bg:#F3F5F7; --panel:#FFFFFF;
  --anthrazit:#2F3539;   /* RAL 7016 Anthrazitgrau (abgedunkelt) */
  --anthrazit2:#3E464B;
  --signal:#F9A800;      /* RAL 1003 Signalgelb */
  --signal-soft:#FFF3D1;
  --sea:#0E518D; --sea-soft:#E3EDF7;     /* RAL 5017 Verkehrsblau */
  --air:#B3141F; --air-soft:#FAE6E7;     /* RAL 3020 Verkehrsrot */
  --split:#5E4F92; --split-soft:#ECE9F6;
  --rail:#9A5426; --rail-soft:#F5EAE2;   /* RAL 8023 Orangebraun */
  --ok:#2C7A41; --ok-soft:#E3F1E7; --warn:#9A6200; --warn-soft:#FFF1D2; --bad:#B3141F; --bad-soft:#FAE6E7;
  --r:8px; --r-s:6px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
a{color:var(--sea);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:4px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}

/* Seitenleiste */
.side{background:var(--anthrazit);color:#D7DCE0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:20px 20px 18px;border-bottom:1px solid #454D53}
.brand .lamp{width:40px;height:40px;flex:none}
.brand b{display:block;font:600 16px/1.2 var(--cond);color:#fff;letter-spacing:.1px}
.brand span{font-size:12px;color:#A8B1B8;display:block}
a.brand{text-decoration:none;color:inherit;cursor:pointer;transition:background .15s}
a.brand:hover{background:#3A4247}
a.brand:hover b{color:var(--signal,#F9A800)}
a.brand:focus-visible{outline:2px solid var(--signal,#F9A800);outline-offset:-2px;border-radius:0}
.routesel{margin:6px 0 3px;width:100%;max-width:190px;background:#3A4247;color:#fff;border:1px solid #5A6369;border-radius:6px;padding:5px 6px;font:500 12.5px var(--sans)}
.routesel:focus{outline:2px solid var(--signal);outline-offset:1px}
.rbanner{display:flex;gap:10px;align-items:flex-start}
.nav{padding:10px 10px 20px;flex:1}
.nav h4{font:500 12px var(--sans);color:#8F99A1;margin:16px 10px 6px}
.nav a{display:flex;gap:10px;align-items:center;color:#D7DCE0;text-decoration:none;padding:7px 10px;border-radius:6px;font-size:14px;line-height:1.3;position:relative}
.nav a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav a:hover{background:var(--anthrazit2);color:#fff}
.nav a.on{background:#fff;color:var(--ink);font-weight:600}
.nav a.on svg{opacity:1;color:var(--ink)}
.nav a.dim{opacity:.38}

.side .foot{padding:14px 20px;font-size:11.5px;color:#8F99A1;border-top:1px solid #454D53}

/* Kopfleiste: Szenario der Sendung */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:500 13.5px var(--sans);color:var(--ink2);cursor:pointer}
.tabs button:hover{border-color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rtop{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.topin{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 28px}
.topmini{display:none;align-items:center;gap:8px 18px;flex-wrap:wrap;padding:7px 28px;font-size:13px;color:var(--ink2)}
.topmini b{color:var(--ink);font-weight:600}
.top.min .topmini{display:flex}.top.min .topin,.top.min .kpis{display:none}
.tbtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font:500 12.5px var(--sans);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tbtn:hover{border-color:var(--ink)}
.topmini .tbtn{margin-left:auto}
.tbtn.strong{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600;padding:7px 14px;font-size:13px}
.tbtn.strong:hover{background:#000}
.topin #topToggle{order:99;margin-left:auto}
.ship{display:flex;gap:0;align-items:stretch;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.ship div{padding:4px 12px;border-left:1px solid var(--line);line-height:1.2}
.ship div:first-child{border-left:none}
.ship.tot{border-color:var(--ink)}.ship.tot b{font-size:16px}
.ship small{display:block;font-size:11px;color:var(--ink3)}
.ship b{font:600 14.5px var(--cond)}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:#fff}
.segc button{border:0;background:none;padding:7px 12px;font:500 13.5px var(--sans);color:var(--ink2);cursor:pointer;display:flex;gap:7px;align-items:center;border-left:1px solid var(--line)}
.segc button:first-child{border-left:0}
.segc button .dot{width:8px;height:8px;border-radius:50%}
.segc button.on{background:var(--ink);color:#fff}
.topctl{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2)}
.topctl input,.topctl select{font:500 13.5px var(--sans);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;color:var(--ink);background:#fff}
.topctl input[type=number]{width:70px}
.dtw{position:relative;display:inline-flex;align-items:center;gap:4px}
.dtw input[data-od]{width:104px;text-align:center}
.dtw input[data-od].bad{border-color:var(--bad);background:var(--bad-soft)}
.dtp{border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:5px 8px;cursor:pointer;font-size:14px;line-height:1}
.dtn{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Kennzahlen als Datenblattzeile */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line2)}
.kpi{padding:10px 28px 12px;border-left:1px solid var(--line2)}
.kpi:first-child{border-left:none}
.kpi .l{font-size:12px;color:var(--ink2)}
.kpi .v{font:600 23px/1.15 var(--cond);margin-top:2px;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--ink3)}

main{padding:26px 28px 70px;max-width:1320px}
.ph{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font:600 30px/1.15 var(--cond);margin:0;letter-spacing:-.2px}
.ph p{margin:6px 0 0;color:var(--ink2);max-width:76ch}
.depts{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink2);background:#fff;white-space:nowrap}
.chip.sea{border-color:transparent;background:var(--sea-soft);color:var(--sea)}
.chip.air{border-color:transparent;background:var(--air-soft);color:var(--air)}
.chip.split{border-color:transparent;background:var(--split-soft);color:var(--split)}
.chip.rail{border-color:transparent;background:var(--rail-soft);color:var(--rail)}
.chip.ok{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.chip.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.chip.bad{border-color:transparent;background:var(--bad-soft);color:var(--bad)}

.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.panel>header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:-2px 0 12px}
.panel h2{font:600 16px/1.3 var(--sans);margin:0}
.panel header .note{font-size:12.5px;color:var(--ink3)}
.panel.flat{background:transparent;border-style:dashed}
.mt{margin-top:18px}
h3{font:600 14px var(--sans);margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--ink2)}.small{font-size:12.5px}.tiny{font-size:11.5px;color:var(--ink3)}
.big{font:600 34px/1.05 var(--cond);letter-spacing:-.3px}
.mid{font:600 22px/1.15 var(--cond)}
.nowrap{white-space:nowrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
thead th{background:var(--bg);font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line);font-size:12.5px}
td.r,th.r{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
tr.sum td{font-weight:600;border-top:1.5px solid var(--ink);border-bottom:none}
tr.sub td{color:var(--ink2)}
tr.hl td{background:var(--signal-soft)}
.tbl-wrap{overflow-x:auto}

/* Formulare */
.f{display:block;font-size:12.5px;color:var(--ink2);font-weight:500}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-s);font:500 14px var(--sans);color:var(--ink);background:#fff}
.f .hint{display:block;font-weight:400;color:var(--ink3);font-size:11.5px;margin-top:3px}
.fr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.fr3{grid-template-columns:repeat(3,minmax(0,1fr))}.fr2{grid-template-columns:repeat(2,minmax(0,1fr))}.fr5{grid-template-columns:repeat(5,minmax(0,1fr))}
.rng{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;font-size:13.5px;margin:6px 0}
.rng input{width:100%;accent-color:var(--ink)}
.rng output{text-align:right;font-weight:600}
.btn{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:var(--r-s);padding:7px 13px;font:500 13.5px var(--sans);cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.signal{background:var(--signal);border-color:var(--signal);color:#251b00}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Hinweise */
.note-box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:#fff;font-size:13.5px}
.note-box.info{background:var(--sea-soft);border-color:#C8DAEC}
.note-box.warn{background:var(--warn-soft);border-color:#F0D9A6}
.note-box.bad{background:var(--bad-soft);border-color:#F0C4C7}
.note-box.ok{background:var(--ok-soft);border-color:#C3DFCB}
.list-plain{margin:0;padding:0;list-style:none}
.list-plain li{padding:9px 0;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:22px 1fr;gap:8px}
.list-plain li:last-child{border-bottom:none}
.list-plain li svg{width:18px;height:18px;margin-top:2px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}

/* Rechenblatt */
.calc td{padding:8px 10px}
.calc td.op{width:34px;text-align:center;font:600 16px var(--cond);color:var(--ink3)}
.calc td.v{text-align:right;font:600 16px var(--cond);white-space:nowrap}
.calc tr.res td{background:var(--bg)}
.calc tr.res td.v{font-size:18px}
.calc tr.key td{background:var(--ink);color:#fff}.calc tr.key td.op{color:#fff}

/* Glossar-Tooltips */
abbr.gl{text-decoration:underline dotted var(--ink3);text-underline-offset:3px;cursor:help;position:relative}
abbr.gl:hover::after,abbr.gl:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:50;width:max-content;max-width:300px;background:var(--ink);color:#fff;font:400 12.5px/1.45 var(--sans);padding:8px 10px;border-radius:6px;white-space:normal;box-shadow:0 6px 20px rgba(31,42,51,.25)}

/* Angebot als Dokument */
.doc{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 34px;font-size:13.5px}
.doc h3{font:600 22px var(--cond);margin:0}

/* Checkliste */
.chk{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.chk input{width:17px;height:17px;margin-top:2px;accent-color:var(--ok)}
.chk b{font-weight:600}
.chk span span{display:block;color:var(--ink3);font-size:12.5px}

.ms td input,.ms td select{padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:500 13px var(--sans);width:100%;background:#fff}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:500;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:80}
.toast.on{opacity:1;transform:none}
svg text{font-family:var(--sans)}
svg .cond{font-family:var(--cond)}
.svgwrap{overflow-x:auto}
.inc td.s{background:var(--sea-soft);color:var(--sea);text-align:center;font-weight:600}
.inc td.b{background:#F1F2F3;color:var(--ink);text-align:center;font-weight:600}
.inc tbody tr{cursor:pointer}
.inc tbody tr.sel td{box-shadow:inset 0 2px 0 var(--ink),inset 0 -2px 0 var(--ink)}
.score{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:1px 6px;font-weight:600}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.leg i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
pre.copy{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:14px;font:400 12.5px/1.55 var(--sans);max-height:420px;overflow:auto;margin:0}

@media (max-width:1100px){
  .app{grid-template-columns:212px minmax(0,1fr)}
  .side .foot{display:none}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:relative;height:auto}
  .nav{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:8px}
  .nav h4{display:none}
  .nav a{white-space:nowrap}
  .top{position:static}
  .ship{display:none}
  .topin{gap:8px}
  .ph h1{font-size:25px}
  .g2,.g3,.g4,.g21,.g12,.fr,.fr3,.fr5{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  main,.topin{padding-left:14px;padding-right:14px}
  .kpi{padding:8px 14px}
  .rng{grid-template-columns:110px 1fr 46px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Pilot-Rundgang */
.thr{background:#fff;border:1px solid var(--line);border-left:4px solid var(--signal);border-radius:var(--r);padding:12px 16px;margin:0 0 16px}
.thr-hd{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.thr-k{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.5px;color:var(--ink2)}
.thr-n{font:400 13.5px var(--sans);color:var(--ink2)}
.thr-n b{color:var(--ink);font-weight:600}
.thr-off{margin-left:auto;border:0;background:none;padding:0;font:400 12.5px var(--sans);color:var(--ink3);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.thr-off:hover{color:var(--ink)}
.thr-dots{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;list-style:none;margin:10px 0 10px;padding:0}
.thr-dots li{display:flex;align-items:center}
.thr-dots li+li::before{content:"";display:block;width:14px;height:2px;background:var(--line)}
.thr-dots li.done+li::before{background:var(--signal)}
.thr-dots a{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;font:600 12px var(--sans);color:var(--ink2);text-decoration:none}
.thr-dots a:hover{border-color:var(--ink);color:var(--ink)}
.thr-dots li.done a{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.thr-dots li.on a{background:var(--ink);border-color:var(--ink);color:#fff}
.thr-line{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.thr-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 4px;padding-top:16px;border-top:1px solid var(--line)}
.thr-back{margin:0 0 12px;font-size:13.5px}
.nav a.thr-go{background:rgba(249,168,0,.13);border:1px solid rgba(249,168,0,.5);color:#fff;margin:0 0 6px}
.nav a.thr-go:hover{background:rgba(249,168,0,.22)}
.nav a.thr-go.act{background:rgba(249,168,0,.26)}
.nav a.thr-go svg{color:var(--signal);opacity:1}
.nav a.thr-go small{display:block;font-size:11.5px;color:#C3CAD0;line-height:1.25;font-weight:400}
.nav .nb{margin-left:auto;flex:none;padding-left:6px;font:600 11px var(--sans);font-style:normal;color:#8F99A1;white-space:nowrap}
.nav a.on .nb{color:var(--ink3)}
.tn{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--signal-soft);color:var(--ink);font:600 11px var(--sans);font-style:normal;margin-right:7px}
.tabs button.on .tn{background:var(--signal)}
/* Risiko */
.hm{display:grid;grid-template-columns:20px 22px repeat(5,minmax(0,1fr));gap:4px}
.hm .ylab{grid-row:1/span 5;grid-column:1;writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;color:var(--ink3);text-align:center;align-self:center}
.hm .ax{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;justify-content:center;min-height:18px}
.hm .c{min-height:48px;border-radius:6px;display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;padding:4px}
.rk{font:600 11px var(--sans);background:#fff;border:1px solid rgba(47,53,57,.25);border-radius:4px;padding:1px 5px;color:var(--ink)}
.rk.off{opacity:.35}
.tl{list-style:none;margin:0 0 12px 6px;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 13px 2px}
.tl li::before{content:'';position:absolute;left:-25px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff}
.leg i.sq{width:12px;height:12px;border-radius:2px}

.mbr{display:grid;grid-template-columns:92px 1fr 58px 58px;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.mbr.on span:first-child{font-weight:600}
.mbr .mbt{height:12px;background:var(--line2);border-radius:3px;overflow:hidden}
.mbr .mbt i{display:block;height:100%;border-radius:3px}
.mbr b{text-align:right;font-weight:600}
.mbr .chip{justify-self:start}

.decision{background:#2F3539;border-color:#2F3539;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:center}
.decision .dec-r{display:grid;gap:10px}
.decision .dec-r div{display:flex;gap:10px;align-items:center;color:#fff;font-size:13.5px;background:#3A4247;border-radius:8px;padding:9px 12px}
.decision .dec-r svg{width:18px;height:18px;stroke:#F9A800;fill:none;stroke-width:1.8;flex:none}

  ticks(y0, y1).forEach(v => { g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${CC.grid}"/>` + tx(l - 8, Y(v) + 4, (o.yFmt || kfmt)(v), {a:'end', fs:11, c:CC.ink3}); });
  if (o.x === 'date'){
    const d = new Date(x0); let m = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1); let i = 0;
    const span = (x1 - x0)/DAY, every = span > 500 ? 3 : span > 260 ? 2 : 1;
    while (m <= x1){ const dd = new Date(m); if (i++ % every === 0) g += `<line x1="${X(m)}" x2="${X(m)}" y1="${H - b}" y2="${H - b + 4}" stroke="${CC.axis}"/>` + tx(X(m), H - b + 17, MON[dd.getUTCMonth()] + (dd.getUTCMonth() === 0 ? ' ' + String(dd.getUTCFullYear()).slice(2) : ''), {a:'middle', fs:11, c:CC.ink3}); m = Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth() + 1, 1); }
  } else {
    ticks(x0, x1, o.xTicks || 7).forEach(v => { g += `<line x1="${X(v)}" x2="${X(v)}" y1="${H - b}" y2="${H - b + 4}" stroke="${CC.axis}"/>` + tx(X(v), H - b + 17, (o.xFmt || kfmt)(v), {a:'middle', fs:11, c:CC.ink3}); });
    if (o.xLabel) g += tx(W - r, H - b + 32, o.xLabel, {a:'end', fs:11, c:CC.ink3});
  }
  g += `<line x1="${l}" x2="${W - r}" y1="${Y(Math.max(y0, 0))}" y2="${Y(Math.max(y0, 0))}" stroke="${CC.axis}"/>`;
  (o.refs||[]).forEach(rf => { g += `<line x1="${l}" x2="${W - r}" y1="${Y(rf.y)}" y2="${Y(rf.y)}" stroke="${rf.c || CC.ink3}" stroke-dasharray="5 4"/>` + tx(rf.a === 'start' ? l + 6 : W - r - 4, Y(rf.y) - 6, rf.label, {a: rf.a || 'end', fs:11.5, c: rf.c || CC.ink2, w:600, halo:true}); });
  (o.vlines||[]).forEach(v => { g += `<line x1="${X(v.x)}" x2="${X(v.x)}" y1="${t}" y2="${H - b}" stroke="${v.c || CC.ink3}" stroke-dasharray="3 4"/>` + (v.label ? tx(X(v.x) + 5, t + 12 + (v.dy||0), v.label, {fs:11, c: v.c || CC.ink2, w:600, halo:true}) : ''); });
  o.series.forEach(s => {
    if (!s.pts.length) return;
    const d = s.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
    if (s.area) g += `<path d="${d}L${X(s.pts.at(-1)[0])} ${Y(Math.max(y0,0))}L${X(s.pts[0][0])} ${Y(Math.max(y0,0))}Z" fill="${s.color}" opacity=".08"/>`;
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.2}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''} stroke-linejoin="round"/>`;
    if (s.dots) s.pts.forEach(p => g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3" fill="${s.color}"/>`);
  });
  (o.marks||[]).forEach(m => { g += `<circle cx="${X(m.x)}" cy="${Y(m.y)}" r="5" fill="${m.c}" stroke="#fff" stroke-width="1.5"/>` + tx(X(m.x) + (m.a === 'end' ? -9 : 9), Y(m.y) + (m.dy ?? -9), m.label, {a: m.a || 'start', fs:12, c:m.c, w:600, halo:true}); });
  if (o.legend){ let lx = l; o.series.filter(s => s.name).forEach(s => { g += `<line x1="${lx}" x2="${lx + 18}" y1="${H - 14}" y2="${H - 14}" stroke="${s.color}" stroke-width="3"${s.dash ? ` stroke-dasharray="${s.dash}"` : ''}/>` + tx(lx + 24, H - 10, s.name, {fs:11.5}); lx += 34 + s.name.length*6.3; }); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title || 'Diagramm')}">${g}</svg>`;
}

/* Horizontale Balken */
function hbars(rows, o={}){
  const W = o.W || 620, lw = o.lw || 170, rw = o.rw || 110, rowH = o.rowH || 32, H = rows.length*rowH + 8;
  const max = (o.max || Math.max(...rows.map(x => x.v)))*1.02;
  let g = '';
  rows.forEach((x, i) => { const y = 4 + i*rowH, w = Math.max(1.5, (W - lw - rw)*Math.max(x.v, 0)/max);
    g += tx(lw - 10, y + rowH/2 + 4, x.label, {a:'end', fs:12.5, c:CC.ink, w: x.bold ? 600 : 400}) + `<rect x="${lw}" y="${y + 7}" width="${w}" height="${rowH - 14}" rx="3" fill="${x.c || CC.mute}"/>` + tx(lw + w + 8, y + rowH/2 + 4, x.txt, {fs:12.5, c:CC.ink, w: x.bold ? 600 : 400}); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title || 'Balkendiagramm')}">${g}</svg>`;
}

/* Wasserfall (Brücke) */
function waterfall(items, o={}){
  const W = o.W || 760, H = o.H || 270, l = 20, b = 54, t = 26, n = items.length, bw = (W - l - 20)/n;
  let run = 0;
  const segs = items.map(it => { if (it.total){ const s = {y0:0, y1:it.v, ...it}; run = it.v; return s; } const s = {y0:run, y1:run + it.v, ...it}; run += it.v; return s; });
  const max = Math.max(...segs.map(s => Math.max(s.y0, s.y1)))*1.1, Y = v => H - b - v/max*(H - t - b);
  let g = `<line x1="${l}" x2="${W - 10}" y1="${H - b}" y2="${H - b}" stroke="${CC.axis}"/>`;
  segs.forEach((s, i) => { const x = l + i*bw + bw*0.18, w = bw*0.64, yt = Y(Math.max(s.y0, s.y1)), h = Math.max(Math.abs(Y(s.y0) - Y(s.y1)), 2);
    g += `<rect x="${x}" y="${yt}" width="${w}" height="${h}" fill="${s.c}"/>` + tx(x + w/2, yt - 7, (o.fmt || nf)(s.v), {a:'middle', fs:12.5, c:CC.ink, w:600}) + tx(x + w/2, H - b + 17, s.label, {a:'middle', fs:12, c:CC.ink2}) + (s.sub ? tx(x + w/2, H - b + 32, s.sub, {a:'middle', fs:11, c:CC.ink3}) : '');
    if (i < segs.length - 1 && !segs[i+1].total) g += `<line x1="${x + w}" x2="${x + bw}" y1="${Y(s.y1)}" y2="${Y(s.y1)}" stroke="${CC.axis}" stroke-dasharray="2 3"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title || 'Wasserfall')}">${g}</svg>`;
}

/* Tornado um einen Basiswert */
function tornadoChart(rows, base, o={}){
  const W = o.W || 760, lw = 200, rowH = 34, t = 30, H = rows.length*rowH + t + 26;
  const vals = rows.flatMap(r => [r.good, r.bad]).concat(base);
  const mn = Math.min(...vals), mx = Math.max(...vals), pad = (mx - mn)*0.18;
  const X = v => lw + (v - (mn - pad))/((mx + pad) - (mn - pad))*(W - lw - 30);
  let g = `<line x1="${X(base)}" x2="${X(base)}" y1="${t - 8}" y2="${H - 22}" stroke="${CC.ink}" stroke-width="1.2"/>` + tx(X(base), t - 14, 'Basis ' + eur(base), {a:'middle', fs:12, c:CC.ink, w:600});
  rows.forEach((r, i) => { const y = t + i*rowH;
    g += tx(lw - 12, y + rowH/2 + 4, r.label, {a:'end', fs:12.5, c:CC.ink});
    [['good', '#2C7A41', r.goodL], ['bad', '#B3141F', r.badL]].forEach(([k, c, lab]) => { const v = r[k], xa = Math.min(X(v), X(base)), w = Math.abs(X(v) - X(base));
      g += `<rect x="${xa}" y="${y + 7}" width="${Math.max(w, 1)}" height="${rowH - 14}" fill="${c}" opacity=".78"/>`;
      const right = v >= base; g += tx(right ? X(v) + 6 : X(v) - 6, y + rowH/2 + 4, eur(v) + ' (' + lab + ')', {a: right ? 'start' : 'end', fs:11, c:CC.ink2}); }); });
  g += tx(lw, H - 6, 'grün = günstige Ausprägung, rot = ungünstige Ausprägung, Wert = Deckungsbeitrag je Einheit', {fs:11, c:CC.ink3});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tornado-Diagramm">${g}</svg>`;
}

/* Gestapelte horizontale Balken (zwei Teile) */
function stackH(rows, o={}){
  const W = o.W || 760, lw = 64, rw = 150, rowH = 30, t = 6, H = rows.length*rowH + t + 30;
  const max = Math.max(...rows.map(r => r.parts.reduce((s, p) => s + p.v, 0)));
  let g = '';
  rows.forEach((r, i) => { const y = t + i*rowH; let x = lw;
    g += tx(lw - 10, y + rowH/2 + 4, r.label, {a:'end', fs:12.5, c:CC.ink, w: r.bold ? 600 : 400});
    r.parts.forEach(p => { const w = (W - lw - rw)*p.v/max; g += `<rect x="${x}" y="${y + 6}" width="${w}" height="${rowH - 12}" fill="${p.c}"${r.bold ? ' stroke="#1F2A33" stroke-width="1.5"' : ''}/>`; x += w; });
    g += tx(x + 8, y + rowH/2 + 4, r.txt, {fs:12, c:CC.ink2}); });
  let lx = lw; (o.legend||[]).forEach(L => { g += `<rect x="${lx}" y="${H - 18}" width="12" height="10" fill="${L.c}"/>` + tx(lx + 18, H - 9, L.label, {fs:11.5}); lx += 30 + L.label.length*6.5; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title || 'Verteilung')}">${g}</svg>`;
}

/* Vertikale Säulen (gruppiert) */
function vbars(cats, series, o={}){
  const W = o.W || 760, H = o.H || 240, l = 52, r = 14, t = 14, b = o.legend ? 50 : 30;
  const max = Math.max(...series.flatMap(s => s.vals))*1.12 || 1, Y = v => H - b - v/max*(H - t - b);
  const cw = (W - l - r)/cats.length, bw = Math.min(28, cw*0.7/series.length);
  let g = '';
  ticks(0, max, 4).forEach(v => g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${CC.grid}"/>` + tx(l - 8, Y(v) + 4, (o.yFmt || kfmt)(v), {a:'end', fs:11, c:CC.ink3}));
  cats.forEach((c, i) => { const cx = l + i*cw + cw/2;
    series.forEach((s, j) => { const v = s.vals[i], x = cx - series.length*bw/2 + j*bw; g += `<rect x="${x}" y="${Y(v)}" width="${bw - 2}" height="${H - b - Y(v)}" fill="${s.c}"/>`; });
    g += tx(cx, H - b + 16, c, {a:'middle', fs:11, c:CC.ink3}); });
  g += `<line x1="${l}" x2="${W - r}" y1="${H - b}" y2="${H - b}" stroke="${CC.axis}"/>`;
  if (o.legend){ let lx = l; series.forEach(s => { g += `<rect x="${lx}" y="${H - 18}" width="12" height="10" fill="${s.c}"/>` + tx(lx + 18, H - 9, s.name, {fs:11.5}); lx += 30 + s.name.length*6.5; }); }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.title || 'Säulendiagramm')}">${g}</svg>`;
}

/* Kleiner Verlauf für Kennzahlenkacheln */
function spark(vals, c){
  const W = 120, H = 30, mx = Math.max(...vals), mn = Math.min(...vals);
  const d = vals.map((v, i) => (i ? 'L' : 'M') + (i/(vals.length - 1)*W).toFixed(1) + ' ' + (H - 3 - (v - mn)/((mx - mn) || 1)*(H - 6)).toFixed(1)).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="120" height="30" aria-hidden="true"><path d="${d}" fill="none" stroke="${c || CC.ink}" stroke-width="1.8"/></svg>`;
}

function routeSvg(r){
  const W = 1000, l = 60, rr = 60, rowH = r.legs.length > 1 ? 128 : 120, H = 44 + r.legs.length*rowH;
  const step = (W - l - rr)/6, X = i => l + i*step;

  // EU-Grenze
  g += `<line x1="${X(3)}" x2="${X(3)}" y1="${r.legs.length > 1 ? 18 : 62}" y2="${H - 22}" stroke="#1F2A33" stroke-dasharray="4 4"/>` +
       tx(X(3) - 8, H - 8, '← Kosten bis Grenze: Zollwert', {a:'end', fs:12, c:CC.ink, w:600}) + tx(X(3) + 8, H - 8, 'Kosten ab Grenze: ' + RT().taxName + '-Wert →', {fs:12, c:CC.ink, w:600});
  r.legs.forEach((lg, k) => {
    const y = (r.legs.length > 1 ? 62 : 46) + k*rowH, col = MODES[lg.mode].col;
    const nodes = [['Bestellung', r.t0], ['Produktion fertig', r.prodEnd], [lg.mode === 'air' ? 'Übergabe FCA' : lg.mode === 'rail' ? 'Verladung Bahn' : 'An Bord (FOB)', r.fob], [lg.mode === 'air' ? 'Ankunft ' + RT().apod.split(' ')[0] : lg.mode === 'rail' ? 'Ankunft Terminal' : 'Ankunft ' + RT().pod, lg.eta], ['Verzollt', lg.clear], ['Zugestellt ' + RT().to, lg.pod], ['Verkaufsbereit', lg.live]];
    const segs = [['Produktion', S.prodDays + ' Tage', 'Anzahlung ' + eur0(0.4*lg.goods)], ['Vorlauf', S.fobLead + ' Tage', RT().export ? 'trägt Albleuchten' : 'trägt Lieferant'], ['Hauptlauf', lg.days.main + ' Tage', eur0(lg.main + lg.ins)], ['Verzollung', lg.days.port + ' Tage', 'Zoll ' + eur0(lg.duty)], ['Nachlauf', lg.days.truck + ' Tage', eur0(lg.after)], ['Einlagerung', S.fbaDays + ' Tage', lg.units + ' Einheiten']];
    if (r.legs.length > 1) g += tx(l - 50, y - 42, MODES[lg.mode].name.replace(/ \(.*\)$/, '') + ': ' + lg.sh.cartons + ' Kartons', {fs:12, c:col, w:600});
    g += `<line x1="${X(0)}" x2="${X(2)}" y1="${y}" y2="${y}" stroke="#AEB7BE" stroke-width="3"/><line x1="${X(2)}" x2="${X(6)}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="3"/>`;
    segs.forEach((s, i) => { const cx = (X(i) + X(i + 1))/2; g += tx(cx, y + 26, s[0], {a:'middle', fs:12, c:CC.ink, w:600}) + tx(cx, y + 42, s[1], {a:'middle', fs:11.5, c:CC.ink2}) + tx(cx, y + 58, s[2], {a:'middle', fs:11.5, c: i >= 2 && i <= 4 ? CC.ink : CC.ink3, w: i >= 2 && i <= 4 ? 600 : 400}); });
    nodes.forEach((n, i) => { const fob = i === 2;
      g += fob ? `<path d="M${X(i)} ${y - 9}l9 9-9 9-9-9z" fill="#F9A800" stroke="#1F2A33" stroke-width="1.2"/>` : `<circle cx="${X(i)}" cy="${y}" r="${i === 6 ? 7 : 5.5}" fill="${i === 6 ? col : '#fff'}" stroke="${i < 2 ? '#86919A' : col}" stroke-width="2"/>`;
      g += tx(X(i), y - 26, n[0], {a:'middle', fs:12, c:CC.ink, w: i === 6 ? 600 : 500}) + tx(X(i), y - 13, 'Tag ' + days(r.t0, n[1]) + ' · ' + dShort(n[1]), {a:'middle', fs:11, c:CC.ink3}); });
  });
  g += `<path d="M${l - 46} ${H - 12}l5 5-5 5-5-5z" fill="#F9A800" stroke="#1F2A33"/>` + tx(l - 36, H - 8, 'Gefahrübergang', {fs:11.5, c:CC.ink2});
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:760px" width="100%" role="img" aria-label="Laufweg der Sendung">${g}</svg></div>`;
}

function hints(){
  const r = scenario(), sea = scenario('sea'), air = scenario('air'), cf = cashflow(r);
  const out = [], sz = withS(patchFor([evById('e16')]), () => scenario('sea'));
  out.push(['euro', `Seefracht spart <b>${eur0(air.landed - sea.landed)}</b> gegenüber Luftfracht, das sind ${eur(( air.landed - sea.landed)/sea.units)} je Einheit.`]);
  if (UI.mode === 'teil'){ const tc = teilCalc(), k = Math.max(0, Math.round(S.teilK));
    out.push(['clock', `Teilsendung: ${nf(k, 0)} Kartons fliegen, der Rest kommt per Schiff. Das kostet ${eur0(r.freight - sea.freight)} mehr Fracht als reine Seefracht (${eur0(r.landed - sea.landed)} mehr Einstandskosten inklusive Zoll), der Verkauf startet dafür ${days(r.firstLive, sea.firstLive)} Tage früher. Die Luftware reicht ${nf(tc.now.reach, 0)} Tage, die Lücke bis zur Seeware beträgt ${nf(tc.gap, 0)} Tage${tc.now.ok ? '.' : ': Das Lager wäre vorher leer, empfohlen sind ' + tc.onlyGap.cartons + ' bis ' + tc.withBuf.cartons + ' Kartons.'}`]); }
  out.push(['warn', `Größtes Terminrisiko: eine massive Sperre im Suezkanal. Die Seeware käme dann erst ab ${dFmt(sz.firstLive)} statt ${dFmt(sea.firstLive)}. Durchrechnen und eine Notfall-Bestellung auslösen geht unter „Notfall-Split“.`]);
  out.push(['einkauf', `Spitzen-Kapitalbedarf: <b>${eur0(cf.peakNeed)}</b> von ${eur0(S.budget)}. Per See wären höchstens ${maxCartonsInBudget('sea')} Kartons, per Luft ${maxCartonsInBudget('air')} Kartons${UI.mode === 'teil' ? ', per Teilsendung ' + maxCartonsInBudget('teil') + ' Kartons' : ''} finanzierbar (Ware, Fracht, Zoll, EUSt und Launch zusammen bis ${eur0(S.budget)}, ohne Rückflüsse).`]);
  out.push(['inc', `${T('FOB')} gilt nur für Seefracht. Für Luftanteile im Kaufvertrag ${T('FCA')} ${RT().apol} vereinbaren.`]);
  if (S.seaCont === 'lcl' && r.sh.cbm > S.lclMax) out.push(['warn', `<b>LCL-Grenze überschritten:</b> ${nf(r.sh.cbm)} cbm > ${nf(S.lclMax, 1)} cbm. Sendung teilen oder ${T('FCL')} anfragen.`]);
  return out;
}

function ctScatter(ms){
  const W = 720, H = 190, l = 60, r = 30, t = 18, b = 38;
  const xs = ms.map(m => days(m.t0, m.firstLive)), ys = ms.map(m => m.perUnit);
  const x0 = 0, x1 = Math.max(...xs)*1.1, y0 = Math.min(...ys)*0.97, y1 = Math.max(...ys)*1.02;
  const X = v => l + (v - x0)/(x1 - x0)*(W - l - r), Y = v => H - b - (v - y0)/(y1 - y0)*(H - t - b);
  let g = '';
  ticks(y0, y1, 3).forEach(v => g += `<line x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}" stroke="${CC.grid}"/>` + tx(l - 8, Y(v) + 4, nf(v, 2) + ' €', {a:'end', fs:11, c:CC.ink3}));
  ticks(x0, x1, 5).forEach(v => g += tx(X(v), H - b + 16, nf(v, 0), {a:'middle', fs:11, c:CC.ink3}));
  g += tx(W - r, H - 6, 'Tage von der Bestellung bis verkaufsbereit', {a:'end', fs:11, c:CC.ink3}) + tx(l, 12, 'Landed Cost je Einheit', {fs:11, c:CC.ink3});

  ms.forEach(m => { const x = X(days(m.t0, m.firstLive)), y = Y(m.perUnit); g += `<circle cx="${x}" cy="${y}" r="7" fill="${MODES[m.mode].col}"/>` + tx(x + 12, y + 4, MODES[m.mode].short + ' ' + eur(m.perUnit), {fs:12, c:CC.ink, w:600, halo:true}); });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Kosten gegen Zeit" style="margin-top:12px">${g}</svg>`;
}
function budgetCheck(){
  const r = scenario(), cf = cashflow(r), st = launchAll(), ship = cf.peakNeed - st, over = cf.peakNeed - S.budget, mx = maxCartonsInBudget(UI.mode), mn = MODES[UI.mode].name;
  return over > 0
    ? note('bad', `<b>Budget überschritten:</b> Mit den Startkosten (${eur0(st)}) liegt der Spitzenbedarf bei ${eur0(cf.peakNeed)}, das sind ${eur0(over)} über den ${eur0(S.budget)}. Per ${mn} sind höchstens <b>${mx} Kartons</b> möglich. <button type="button" class="tbtn strong" data-fit="1">Auf ${mx} Kartons setzen</button>`)
    : note('info', `<b>Budget eingehalten:</b> Die Sendung bindet in der Spitze ${eur0(ship)}. Mit den Startkosten (${eur0(st)}, siehe Einkauf) sind es ${eur0(cf.peakNeed)} von ${eur0(S.budget)}, Reserve ${eur0(-over)}. Per ${mn} wären höchstens ${mx} Kartons möglich.`);

/* Technische Zeichnung: Karton und Palette mit Bemaßung */
function drawingSvg(){
  const p = palletInfo(), sh = ship(S.cartons);
  const s = 2.0, cw = S.L*s, chh = S.H*s, dx = S.B*s*0.55, dy = S.B*s*0.38, x0 = 60, y0 = 70 + dy;
  const arrowDefs = `<defs><marker id="dimA" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 2L5 5L0 8" fill="none" stroke="#55616B" stroke-width="1.4"/></marker></defs>`;
  const dim = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#55616B" stroke-width="1" marker-start="url(#dimA)" marker-end="url(#dimA)"/>`;
  let g = arrowDefs;
  // Karton isometrisch
  g += `<path d="M${x0} ${y0}h${cw}l${dx} ${-dy}h${-cw}z" fill="#EBD5A8" stroke="#8C6A2F"/>`;
  g += `<path d="M${x0 + cw} ${y0}l${dx} ${-dy}v${chh}l${-dx} ${dy}z" fill="#D9BC86" stroke="#8C6A2F"/>`;
  g += `<rect x="${x0}" y="${y0}" width="${cw}" height="${chh}" fill="#F2E2BF" stroke="#8C6A2F"/>`;
  g += `<line x1="${x0 + cw/2}" y1="${y0}" x2="${x0 + cw/2 + dx}" y2="${y0 - dy}" stroke="#C9A866" stroke-width="5" opacity=".7"/>`;
  g += tx(x0 + cw/2, y0 + chh/2 + 2, nf(S.kg, 1) + ' kg', {a:'middle', fs:14, c:CC.ink, w:600, cls:'cond'}) + tx(x0 + cw/2, y0 + chh/2 + 18, S.upc + ' Einheiten', {a:'middle', fs:11.5, c:CC.ink2});
  g += dim(x0, y0 + chh + 16, x0 + cw, y0 + chh + 16) + tx(x0 + cw/2, y0 + chh + 32, S.L + ' cm', {a:'middle', fs:12.5, c:CC.ink, w:600});
  g += dim(x0 + cw + dx + 16, y0 - dy, x0 + cw + dx + 16, y0 - dy + chh) + tx(x0 + cw + dx + 24, y0 - dy + chh/2 + 4, S.H + ' cm', {fs:12.5, c:CC.ink, w:600});
  g += dim(x0 - 6, y0 - 14, x0 - 6 + dx, y0 - 14 - dy) + tx(x0 + dx/2 - 14, y0 - dy/2 - 22, S.B + ' cm', {a:'end', fs:12.5, c:CC.ink, w:600});
  g += tx(x0, 24, 'Karton', {fs:13, c:CC.ink, w:600}) + tx(x0, 40, nf(sh.cbmC, 3) + ' cbm je Karton', {fs:11.5, c:CC.ink3});
  // Palette Vorderansicht
  if (S.palletize){
    const px = 380, s2 = 1.25, pw = S.palL*s2, base = 260, perRow = Math.max(1, Math.floor(S.palL/(p.rot ? S.B : S.L))), cwid = pw/perRow, lh = S.H*s2;
    g += tx(px, 24, 'Europalette, Vorderansicht', {fs:13, c:CC.ink, w:600}) + tx(px, 40, p.perLayer + ' Kartons je Lage × ' + p.layers + ' Lagen = ' + p.perPal + ' Kartons', {fs:11.5, c:CC.ink3});
    g += `<rect x="${px}" y="${base}" width="${pw}" height="${S.palH*s2*0.45}" fill="#B98C4F"/>`;
    [0, 0.5, 1].forEach(f => g += `<rect x="${px + f*(pw - 16)}" y="${base + S.palH*s2*0.45}" width="16" height="${S.palH*s2*0.55}" fill="#9B7139"/>`);
    for (let L = 0; L < p.layers; L++) for (let c = 0; c < perRow; c++) g += `<rect x="${px + c*cwid + 1}" y="${base - (L + 1)*lh}" width="${cwid - 2}" height="${lh - 2}" fill="#F2E2BF" stroke="#8C6A2F"/>`;
    const top = base - p.layers*lh, rx = px + pw + 18;
    g += dim(px, base + S.palH*s2 + 14, px + pw, base + S.palH*s2 + 14) + tx(px + pw/2, base + S.palH*s2 + 30, S.palL + ' cm', {a:'middle', fs:12.5, c:CC.ink, w:600});
    g += dim(rx, top, rx, base + S.palH*s2) + tx(rx + 8, (top + base)/2, p.h + ' cm', {fs:12.5, c:CC.ink, w:600}) + tx(rx + 8, (top + base)/2 + 15, '= ' + S.palH + ' + ' + p.layers + ' × ' + S.H, {fs:11, c:CC.ink3});
    g += tx(rx + 8, (top + base)/2 + 30, nf(S.palL*S.palB*p.h/1e6, 3) + ' cbm', {fs:11, c:CC.ink3});
    // Sendung
    const sx = 690;
    g += tx(sx, 24, 'Sendung', {fs:13, c:CC.ink, w:600}) + tx(sx, 40, sh.nPal + ' Paletten · ' + S.cartons + ' Kartons', {fs:11.5, c:CC.ink3});
    const n = sh.nPal, cols = Math.min(n, 4), w2 = 56;
    for (let i = 0; i < n && i < 12; i++){ const cx = sx + (i % cols)*(w2 + 10), cy = 70 + Math.floor(i/cols)*72;
      const onPal = Math.min(p.perPal, S.cartons - i*p.perPal);
      g += `<rect x="${cx}" y="${cy}" width="${w2}" height="44" fill="#F2E2BF" stroke="#8C6A2F"/><rect x="${cx}" y="${cy + 44}" width="${w2}" height="7" fill="#B98C4F"/>` + tx(cx + w2/2, cy + 27, onPal + ' Kt.', {a:'middle', fs:11.5, c:CC.ink, w:600}); }
    const yy = 70 + Math.ceil(Math.min(n,12)/cols)*72 + 16;
    g += tx(sx, yy, nf(sh.cbm, 2) + ' cbm', {fs:20, c:CC.ink, w:600, cls:'cond'}) + tx(sx + 110, yy, nf(sh.kg, 0) + ' kg', {fs:20, c:CC.ink, w:600, cls:'cond'});
    g += tx(sx, yy + 16, 'Volumen', {fs:11, c:CC.ink3}) + tx(sx + 110, yy + 16, 'Bruttogewicht', {fs:11, c:CC.ink3});
  } else {
    g += tx(400, 120, 'Lose Kartons ohne Palette', {fs:14, c:CC.ink, w:600}) + tx(400, 142, S.cartons + ' × ' + nf(sh.cbmC, 3) + ' cbm = ' + nf(sh.cbm, 3) + ' cbm, ' + nf(sh.kg, 0) + ' kg', {fs:12.5, c:CC.ink2});
  }
  return `<div class="svgwrap"><svg viewBox="0 0 960 340" style="min-width:720px" width="100%" role="img" aria-label="Technische Zeichnung Karton und Palette">${g}</svg></div>`;
}

/* ---------- Containerwahl ---------- */
function contSvg(type, cartons){
  const c = CONT[type], cp = contPlan(cartons, type), W = 1060, pad = 20, sc = (W - pad - 46)/CONT['40'].L, w = c.L*sc, h = c.B*sc, x0 = pad, y0 = 34;
  let g = `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#F3F5F7" stroke="#2F3539" stroke-width="2"/>` +
    `<line x1="${x0 + w}" x2="${x0 + w}" y1="${y0}" y2="${y0 + h}" stroke="#2F3539" stroke-width="5"/>` + tx(x0 + w + 8, y0 + h/2 + 4, 'Tür', {fs:11.5, c:CC.ink2}) +
    tx(x0, y0 - 12, `${c.name}: innen ${nf(c.L/1000, 2)} × ${nf(c.B/1000, 2)} × ${nf(c.H/1000, 2)} m · ${nf(c.cbm, 1)} cbm · max. ${nf(c.kg, 0)} kg Nutzlast`, {fs:12.5, c:CC.ink, w:600});
  const inThis = Math.min(cartons, cp.cap);
  if (cp.pal){
    const PL = S.palL*10*sc, PB = S.palB*10*sc, used = Math.ceil(inThis/cp.perPal), pos = [];
    if (cp.mixed){ const nA = Math.floor(c.L/(S.palB*10)), nB = Math.floor(c.L/(S.palL*10));
      for (let i = 0; i < nA; i++) pos.push([x0 + i*PB, y0, PB, PL]);
      for (let i = 0; i < nB; i++) pos.push([x0 + i*PL, y0 + PL, PL, PB]); }
    else { const nr = Math.floor(c.B/(S.palB*10)), nl = Math.floor(c.L/(S.palL*10)); for (let j = 0; j < nr; j++) for (let i = 0; i < nl; i++) pos.push([x0 + i*PL, y0 + j*PB, PL, PB]); }
    pos.sort((a, b) => a[0] - b[0] || a[1] - b[1]).forEach((q, i) => { const on = i < used;
      g += `<rect x="${q[0] + 1.5}" y="${q[1] + 1.5}" width="${q[2] - 3}" height="${q[3] - 3}" rx="2" fill="${on ? '#F9A800' : '#fff'}" stroke="${on ? '#9A6200' : '#B9C1C7'}" stroke-dasharray="${on ? '0' : '4 3'}"/>`; });
    g += tx(x0, y0 + h + 22, `${cp.slots} Stellplätze für Europaletten${cp.tiers > 1 ? ', ' + cp.tiers + '-fach gestapelt' : ' (Palettenhöhe ' + nf(palletInfo().h, 0) + ' cm, nicht stapelbar)'} · belegt: ${used} Palette(n) mit ${inThis} Kartons`, {fs:12, c:CC.ink2});
  } else {
    const G = cp.grid, cw = G.dl*sc, cb = G.db*sc, layerN = G.nl*G.nb, full = Math.floor(inThis/layerN), rest = inThis % layerN;
    for (let j = 0; j < G.nb; j++) for (let i = 0; i < G.nl; i++){ const k = j*G.nl + i, depth = full + (k < rest ? 1 : 0);
      g += `<rect x="${x0 + i*cw + 1}" y="${y0 + j*cb + 1}" width="${cw - 2}" height="${cb - 2}" fill="${depth ? '#F9A800' : '#fff'}" fill-opacity="${depth ? 0.35 + 0.65*depth/G.nh : 1}" stroke="${depth ? '#9A6200' : '#D5DBE0'}"/>`; }
    g += tx(x0, y0 + h + 22, `Lose gestaut: ${G.nl} × ${G.nb} Kartons je Lage, ${G.nh} Lagen = ${nf(G.nl*G.nb*G.nh, 0)} Kartons · Farbe = Stapelhöhe, ${inThis} Kartons geladen`, {fs:12, c:CC.ink2});
  }
  const H = y0 + h + 34;
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:720px" width="100%" role="img" aria-label="Stauplan ${c.name}">${g}</svg></div>`;
}

/* ================= Teilsendung per Luft: wie viele Kartons müssen fliegen? ================= */
/* Idee: ein Teil der Bestellung fliegt, damit der Verkauf früher startet; der Rest kommt per Schiff.
   Die Luftware muss die Lücke bis zur Ankunft der Seeware decken, sonst ist das Lager zwischendurch leer. */
function teilCalc(){
  const air = scenario('air'), sea = scenario('sea');
  const gap = Math.max(0, days(air.firstLive, sea.firstLive));
  const vf = scenF().vol, rate = vf*rateAt(0)/30, upc = S.upc, buf = Math.max(0, +S.safetyDays || 0);
  const mk = (n, c) => { const k = c === undefined ? Math.max(0, Math.round(S.teilK)) : c, u = k*upc, reach = demandDays(vf, u);
    return {days: n, need: demandIn(vf, n), cartons: k, units: u, reach, diff: reach - gap, ok: reach >= gap - 1e-9}; };
  const cart = n => Math.ceil(demandIn(vf, n)/upc - 1e-9);
  const onlyGap = mk(gap, cart(gap)), withBuf = mk(gap + buf, cart(gap + buf)), now = mk(gap);
  return {air, sea, gap, rate, vf, buf, upc, onlyGap, withBuf, now};
}
function teilPanel(sc){
  const C = teilCalc(), tt = sc[2], se = sc[0], full = S.cartons;
  const col = (x, set) => `<td class="r">${x}</td>`;
  const cols = [C.onlyGap, C.withBuf, C.now];
  const rowsT = [
    ['Zu überbrückende Tage', x => nf(x.days, 0)],
    ['Bedarf in diesen Tagen', x => nf(x.need, 0) + ' Einh.'],
    ['Kartons per Luft', x => `<b>${nf(x.cartons, 0)}</b>`],
    ['Einheiten per Luft', x => nf(x.units, 0)],
    ['Reichweite der Luftware', x => nf(x.reach, 1) + ' Tage'],
    ['Reichweite minus Lücke', x => `${x.diff >= 0 ? '+' : ''}${nf(x.diff, 1)} Tage`],
    ['Deckt die Luftware die Lücke?', x => x.ok ? '<span class="chip ok">Ja</span>' : '<span class="chip bad">Nein, Lager leer vor Ankunft See</span>']];
  const tooBig = C.withBuf.cartons >= full;
  return panel('Teilsendung per Luft: wie viele Kartons müssen fliegen?',
    `<p class="small muted" style="margin:0 0 10px">Die Luftware ist am ${dFmt(C.air.firstLive)} verkaufsbereit, die Seeware erst am ${dFmt(C.sea.firstLive)}. Diese <b>${nf(C.gap, 0)} Tage</b> muss die Luftware überbrücken. Bei ${salesTxt(C.vf)} und ${nf(C.upc, 0)} Einheiten je Karton ergibt sich die Menge unten. Weil der Absatz anfangs niedriger ist, brauchen die ersten Tage weniger Ware. Mehr als nötig zu fliegen kostet nur Luftaufpreis.</p>
    <div class="fr">${field('teilK', 'Kartons per Luft (eingestellt)', 1, 'von ' + nf(full, 0) + ' Kartons gesamt', 'min="0" max="' + full + '"')}${field('safetyDays', 'Sicherheitspuffer (Tage)', 1, 'gilt auch für die Nachbestellung')}</div>
    <div class="tbl-wrap mt"><table><thead><tr><th></th><th class="r">Nur die Lücke abdecken</th><th class="r">Lücke + Sicherheitspuffer</th><th class="r">Eingestellt</th></tr></thead><tbody>
      ${rowsT.map(([lab, f]) => `<tr${lab === 'Kartons per Luft' ? ' class="hl"' : ''}><td>${lab}</td>${cols.map(x => col(f(x))).join('')}</tr>`).join('')}
      <tr><td></td><td class="r"><button class="tbtn" data-teilset="${C.onlyGap.cartons}">${nf(C.onlyGap.cartons, 0)} Kartons übernehmen</button></td><td class="r"><button class="tbtn strong" data-teilset="${C.withBuf.cartons}">${nf(C.withBuf.cartons, 0)} Kartons übernehmen</button></td><td></td></tr>
    </tbody></table></div>
    ${tooBig ? note('warn', 'Die empfohlene Luftmenge mit Puffer ist so groß wie die ganze Bestellung. Dann ist ganz Luft die einfachere Wahl.') : ''}
    <div class="grid g3 mt" style="gap:14px">${stat('Erste Ware früher als bei See', nf(days(tt.firstLive, se.firstLive), 0) + ' Tage', 'Teilsendung ab ' + dFmt(tt.firstLive) + ', See ab ' + dFmt(se.firstLive))}${stat('Mehrfracht gegenüber See', eur0(tt.freight - se.freight), eur(tt.freight/tt.units - se.freight/se.units) + ' je Einheit über die ganze Bestellung')}${stat('Deckungsbeitrag je Einheit', eur(unitEcon(tt.perUnit).db), 'See: ' + eur(unitEcon(se.perUnit).db))}</div>
    <p class="tiny" style="margin-top:10px">Rechnung: Lücke = Seeware verkaufsbereit minus Luftware verkaufsbereit. Bedarf = Summe des Tagesabsatzes über diese Tage ab dem ersten Verkauf (Absatz je Monat ÷ 30, mit Anlaufkurve und Szenariofaktor). Kartons = Bedarf ÷ Einheiten je Karton, aufgerundet. Die Seemenge wird um die Luftkartons kleiner; der Staffelpreis richtet sich weiter nach der ganzen Bestellung. Die Teilsendung ist unabhängig vom Notfall-Split, der bei einem Risiko reagiert.</p>`,
    'Kopfleiste: Knopf „Teilsendung“ rechnet die ganze App damit');
}

function emCtx(){
  const all = S.reOn ? planOrders(undefined, true) : null, o2 = all ? all.orders[1] : null;
  let room = null; if (all && o2){ room = Infinity; for (const [t, c] of all.cashPts) if (t >= o2.t && c < room) room = c; }

  if (UI.emOrder === 2 && o2) return Object.assign({which: 2, o2, k0: 0, patch: {orderDate: dIso(o2.t), cartons: o2.r.cartons, teilK: 0, prodDays: S.prodDays + (o2.cny ? 21 : 0), priceUnits: S.reRahmen ? S.tiers[S.tiers.length - 1][0] : 0}}, ex);
  const k0 = UI.mode === 'teil' ? Math.min(S.cartons, Math.max(0, Math.round(S.teilK))) : UI.mode === 'air' ? S.cartons : 0;
  return Object.assign({which: 1, o2, k0, patch: {teilK: k0}}, ex);
}
/* Budgetgrenze: Passt eine Notfall-Variante in das Pilotbudget? B1: Spitzenbedarf der Sendung; B2: freie Liquidität zum Zeitpunkt der Nachbestellung */
function budgetFn(ctx){
  if (ctx.which === 2 && ctx.room != null){
    const room = ctx.room, base = ctx.base;
    return z => { const left = room - (z.landed - base); return {need: S.budget - left, fits: left >= -0.5}; };
  }
  return z => { const need = cashflow(z).peakNeed; return {need, fits: need <= S.budget + 0.5}; };
}
/* Reaktion am Verladetag: Es steht fest, dass die Seeware D Tage länger braucht. Wie viele Kartons müssen zusätzlich per Luft? */
function reactCalc(D, ctx){
  const k0 = ctx.k0, vf = scenF().vol, C = S.cartons, upc = S.upc, B2 = ctx.which === 2;
  const plan = withS({teilK: k0}, () => scenario(k0 > 0 ? 'teil' : 'sea')), PZ = patchFor([{sea: D}]), bud = budgetFn(ctx);
  const db = Math.max(unitEcon(plan.perUnit).db, 0);
  const rateB2 = vf*rateAt(Math.max(0, days(ctx.t1 || plan.t0, plan.firstLive)))/30;
  const rows = [];
  for (let kk = k0; kk <= C; kk++){
    const z = withS(Object.assign({}, PZ, {teilK: kk}), () => scenario(kk > 0 ? 'teil' : 'sea'));
    const air = z.legs.find(l => l.mode === 'air'), sea = z.legs.find(l => l.mode === 'sea'), pSea = plan.legs.find(l => l.mode === 'sea');
    let out = 0, rate = rateB2;

    }
    const extra = z.landed - plan.landed, capital = plan.goods*S.interest/100*D/365*(C - kk)/C, lost = out*rate*db*S.lostShare/100;

  const none = rows[0], gapless = rows.find(x => x.out < 0.5) || rows[rows.length - 1], okR = rows.filter((x, i) => x.fits || i === 0), best = okR.reduce((a, b) => b.dmg < a.dmg - 1e-6 ? b : a, rows[0]);
  let maxFit = rows[0]; rows.forEach(x => { if (x.fits) maxFit = x; });

}
/* Eigener Verzug als Zeile der Risikotabelle: gleiche Rechnung wie die Reaktion am Verladetag, im Format von splitCalc */

/* k0 = Kartons, die laut Plan schon per Luft fliegen (Teilsendung); 0 = reine Seebestellung. */

  if (n.cat === 'Hafen') return 'R8';
  if (n.cat === 'Zoll' || n.cat === 'Compliance') return 'R13';
  if (n.cat === 'Finanzen' || n.cat === 'Währung') return 'R14';
  if (n.cat === 'Wetter') return /atlantik|biskaya|nordsee|sturm/.test(t) && !/shanghai|ningbo|taifun/.test(t) ? 'R6' : 'R5';
  if (n.cat === 'Piraterie') return /singapur/.test(t) ? 'R3' : 'R2';
  if (n.cat === 'Markt') return /hormus|öl|bunker/.test(reg) ? 'R4' : 'R9';

  if (n.cat === 'Route') return /suez/.test(reg) && /sperr|blockier|quer/.test(t) ? 'R16' : 'R1';
  return null;
}

/* Schaden in Euro: Mehrkosten + Kapitalbindung + verlorener Absatz während des Verzugs */
function impactOf(evs, mode){

  const dW = r0.legs.reduce((s, l, i) => s + days(l.live, r1.legs[i].live)*l.units, 0)/r0.units;

  const ga = evs.reduce((s, e) => s + (e.gaPct || 0), 0)/100*r0.goods;

  return {r0, r1, delay, extra, ga, capital, lost, total: extra + capital + lost};
}

function seasonSvg(r){
  const rows = [['Taifune Ostchina', [0,0,0,0,1,2,3,3,3,2,1,0]], ['Südwest-Monsun Arabisches Meer', [0,0,0,0,1,3,3,3,2,0,0,0]], ['Piraterie Somalia (Zwischenmonsun)', [1,1,2,2,2,1,1,1,1,2,2,2]],
    ['Winterstürme Nordatlantik', [3,3,2,1,0,0,0,0,1,2,2,3]], ['Südwinter am Kap', [0,0,0,1,2,3,3,3,2,1,0,0]], ['Feiertage China (Neujahr, Golden Week)', [2,3,0,0,1,0,0,0,0,2,0,0]]];
  const W = 1000, l = 250, cw = (W - l - 10)/12, rh = 26, t = 30, sy = t + rows.length*rh + 14, H = sy + 2*rh + 40;
  const col = ['#F3F5F7', '#FFF1D2', '#F6C976', '#E08A3C'];
  let g = '';
  MON.forEach((m, i) => g += tx(l + i*cw + cw/2, t - 9, m, {a:'middle', fs:11.5, c:CC.ink2}));
  rows.forEach((rw, j) => { const yy = t + j*rh; g += tx(l - 10, yy + 17, rw[0], {a:'end', fs:12, c:CC.ink});
    rw[1].forEach((v, i) => g += `<rect x="${l + i*cw + 1}" y="${yy + 2}" width="${cw - 2}" height="${rh - 4}" rx="3" fill="${col[v]}"/>`); });
  // diese Sendung: eigene Zeilen unter dem Kalender
  g += `<line x1="${l}" x2="${l + 12*cw}" y1="${sy - 7}" y2="${sy - 7}" stroke="${CC.axis}" stroke-dasharray="3 3"/>`;
  const pos = t2 => { const d = new Date(t2); return l + (d.getUTCMonth() + (d.getUTCDate() - 1)/31)*cw; };
  const bar = (a, b, yy, c) => { const xa = pos(a), xb = pos(b), h = rh - 10;
    if (xb < xa || b - a > 300*DAY) g += `<rect x="${xa}" y="${yy}" width="${l + 12*cw - xa}" height="${h}" rx="4" fill="${c}"/><rect x="${l}" y="${yy}" width="${Math.max(4, xb - l)}" height="${h}" rx="4" fill="${c}"/>`;
    else g += `<rect x="${xa}" y="${yy}" width="${Math.max(4, xb - xa)}" height="${h}" rx="4" fill="${c}"/>`; };
  const L = r.legs.find(x => x.mode === 'sea') || r.legs[0];
  g += tx(l - 10, sy + 17, 'Diese Sendung: Produktion', {a:'end', fs:12, c:CC.ink, w:600});
  bar(r.t0, r.fob, sy + 5, '#55616B');
  g += tx(l - 10, sy + rh + 17, `Diese Sendung: Transport ${L.mode === 'air' ? 'Luft' : L.mode === 'rail' ? 'Bahn' : 'See'}`, {a:'end', fs:12, c:CC.ink, w:600});
  bar(r.fob, L.pod, sy + rh + 5, MODES[L.mode].col);
  const ly = sy + 2*rh + 28;
  [['gering', 1], ['mittel', 2], ['hoch', 3]].forEach((x, i) => g += `<rect x="${l + i*90}" y="${ly - 10}" width="14" height="12" rx="2" fill="${col[x[1]]}"/>` + tx(l + i*90 + 20, ly, x[0], {fs:11.5, c:CC.ink2}));
  g += tx(W - 10, ly, 'Klimatologische Erfahrungswerte, keine Wetterprognose', {a:'end', fs:11, c:CC.ink3});
  return `<div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" style="min-width:760px" width="100%" role="img" aria-label="Saisonkalender der Risiken">${g}</svg></div>`;
}

function planMonths(n){
  /* Einmalbestellung: der Bestand wird Monat für Monat abverkauft, danach ist Schluss */
  const r = scenario(UI.mode), t1 = r.firstLive, rows = [], landed = r.perUnit, ue = unitEcon(landed, S.price, planAt(t1, t1).acos, true);
  let cum = -launchAll(), be = null, stock = r.units;
  for (let i = 0; i < n && (stock > 0 || i === 0); i++){
    const t = dAdd(t1, Math.round(i*30.44) + 15), pl = planAt(t, t1), u = Math.min(stock, Math.round(pl.vol)), open = stock;
    stock -= u;
    const store = (open + stock)/2*S.storeM, db = u*ue.db;
    const row = {i, t, pl, u, open, stock, rev: u*ue.net, fees: u*ue.fees, ads: u*ue.mkt, ret: u*ue.ret, cogs: u*landed, db, store, res: db - store};
    cum += row.res; row.cum = cum; if (be === null && cum >= 0) be = row; rows.push(row);
  }
  return {rows, be, landed, t1, ue, soldOut: stock <= 0 ? rows[rows.length - 1] : null, restStock: stock};
}

function cbSummary(){
  const r = scenario(), cf = cashflowPilot();
  return `${MODES[UI.mode].name}, ${S.cartons} Kartons, Budget ${eur0(S.budget)}: Landed Cost ${eur(r.perUnit)} je Einheit, Kapitalbedarf ${eur0(cf.peakNeed)} (${cf.peakNeed > S.budget ? 'über Budget!' : 'Reserve ' + eur0(S.budget - cf.peakNeed)}), verkaufsbereit ${dFmt(r.firstLive)}, Ergebnis nach 18 Monaten ${eur0(cf.profit)}.`;
}
function cbApply(res){
  const done = [], prev = {S: {}, UI: {}};
  const a = res && typeof res.aendern === 'object' && res.aendern ? res.aendern : {};
  for (const k in a){
    if (CB_FIELDS[k]){ const [mn, mx, lab] = CB_FIELDS[k], v = Math.round(Number(a[k])); if (isFinite(v) && v >= mn && v <= mx && v !== S[k]){ prev.S[k] = S[k]; S[k] = v; done.push(lab + ' ' + nf(v, 0)); } }
    else if (k === 'mode' && ['sea','air'].includes(a[k]) && a[k] !== UI.mode){ prev.UI.mode = UI.mode; UI.mode = a[k]; done.push('Modus ' + MODES[a[k]].short); }
    else if (k === 'seaCont' && ['lcl','20','40'].includes(String(a[k])) && String(a[k]) !== S.seaCont){ prev.S.seaCont = S.seaCont; S.seaCont = String(a[k]); done.push('Seefracht als ' + (S.seaCont === 'lcl' ? 'Sammelgut' : S.seaCont + ' Fuß')); }
    else if (k === 'orderDate' && /^\d{4}-\d{2}-\d{2}$/.test(String(a[k])) && a[k] !== S.orderDate){ prev.S.orderDate = S.orderDate; S.orderDate = String(a[k]); done.push('Bestellung ' + dFmt(dParse(S.orderDate))); }
  }
  if (res && res.stoerung && ['auto','none'].concat(DISRUPT).includes(res.stoerung) && res.stoerung !== (UI.disrupt || 'auto')){ prev.UI.disrupt = UI.disrupt; UI.disrupt = res.stoerung; done.push('Störung: ' + (res.stoerung === 'auto' ? 'aus dem Lagebild' : res.stoerung === 'none' ? 'keine' : evById(res.stoerung).label)); }
  if (res && res.seite && P[res.seite] && res.seite !== route()){ location.hash = res.seite; }
  if (done.length){ CB.undo = prev; render(); const m = cbAdd('sys', 'Geändert: ' + done.join(', ') + '.\n' + cbSummary()); const b = document.createElement('button'); b.textContent = 'Rückgängig'; b.onclick = () => { Object.assign(S, CB.undo.S); Object.assign(UI, CB.undo.UI); CB.undo = null; render(); b.remove(); cbAdd('sys', 'Zurückgesetzt. ' + cbSummary()); }; m.append(document.createElement('br'), b); }
}
async function cbSend(q){
  q = String(q || '').trim(); if (!q || CB.busy || !SAMPLE) return;
  CB.busy = true; $('#cbSend').disabled = true; $('#cbIn').value = '';
  cbAdd('u', q); CB.turns.push({role: 'user', content: q});
  const wait = cbAdd('a', 'Denke nach …');
  CB.ctl = new AbortController();
  const input = [{role: 'user', content: CB_RULES + '\n\nDATEN:\n' + JSON.stringify(cbState())}].concat(CB.turns.slice(-10));
  try {
    const res = await SAMPLE.json(input, {modelTier: 'default', cache: false, signal: CB.ctl.signal});
    const ans = res && typeof res.antwort === 'string' && res.antwort.trim() ? res.antwort.trim() : 'Erledigt.';
    wait.textContent = ans; CB.turns.push({role: 'assistant', content: ans});
    cbApply(res);
  } catch (e){
    const code = e && e.code;
    if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed'){ wait.textContent = 'Der Assistent ist in dieser Ansicht nicht freigegeben.'; $('#cbFab').hidden = true; }
    else wait.textContent = code === 'rate_limited' ? 'Gerade zu viele Anfragen. Bitte gleich noch einmal versuchen.' : code === 'cancelled' ? 'Abgebrochen.' : 'Das hat nicht geklappt. Bitte die Frage anders stellen.';
    CB.turns.pop();
  }
  CB.busy = false; $('#cbSend').disabled = false; $('#cbIn').focus();
}
function initChat(){
  if (document.getElementById('cbFab')) return;
  const ic = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg>';
  const wrap = document.createElement('div');
  wrap.innerHTML = `<button class="cb-fab" id="cbFab" aria-label="Assistent öffnen">${ic}Fragen</button>
  <section class="cb" id="cbBox" hidden aria-label="Assistent">
    <div class="cb-head"><b>Assistent<span>Frag frei: Produkt, Einkauf, Produktion, Lieferung, Bestand, Zoll, Marge, Risiko</span></b><button id="cbClose" aria-label="Schließen">×</button></div>
    <div class="cb-log" id="cbLog"></div>
    <div class="cb-sug" id="cbSug">${[['Produkt', 'Was für ein Produkt importieren wir, und welche Prüfungen und Pflichten brauchen wir?'], ['Einkauf', 'Wie sind die Staffelpreise, und wann zahlen wir wie viel an den Lieferanten?'], ['Produktion', 'Wie lange dauert die Produktion, und wann ist die Ware verladebereit?'], ['Lieferung', 'Wann ist die Ware in Graben verkaufsbereit, mit See und mit Luft?'], ['Bestand', 'Wie lange reicht der Bestand aus der Einmalbestellung?'], ['Zoll', 'Was kosten Zoll und Einfuhrumsatzsteuer, und was davon ist echte Belastung?'], ['Preis & Marge', 'Was bleibt uns je Leuchte nach allen Kosten, und was ist der Mindestpreis?'], ['Risiko', 'Wie sieht es heute aus, ist risikotechnisch etwas los?'], ['Was wäre wenn', 'Was wäre mit 100 Kartons und 80.000 € Budget?']].map(([l, q]) => `<button data-cbq="${esc(q)}" title="${esc(q)}">${esc(l)}</button>`).join('')}</div>
    <form class="cb-form" id="cbForm"><input id="cbIn" placeholder="Frag frei, z. B. zu Lieferant, Bestand, Lieferzeit …" autocomplete="off"><button id="cbSend" type="submit">Senden</button></form>
    <div class="cb-foot">KI-generiert (AI Act Art. 50) aus den Daten dieser App. Änderungen lassen sich rückgängig machen.</div>
  </section>`;
  document.body.append(...wrap.children);
  cbAdd('a', 'Hallo! Du kannst mich frei fragen: zum Produkt, Einkauf, zur Produktion, Lieferung, zum Bestand, zu Zoll, Preis und Marge oder zur Risikolage. Ich antworte aus den Zahlen dieser App und kennzeichne, wenn ich allgemeines Fachwissen nutze. Was die App nicht kennt, etwa echte Lagerbestände oder Lieferantendaten, sage ich dir. Werte kann ich auf Wunsch direkt einstellen.');
  $('#cbFab').onclick = () => { $('#cbBox').hidden = false; $('#cbFab').hidden = true; $('#cbIn').focus(); };
  $('#cbClose').onclick = () => { $('#cbBox').hidden = true; $('#cbFab').hidden = false; if (CB.ctl) CB.ctl.abort(); };
  $('#cbForm').onsubmit = e => { e.preventDefault(); cbSend($('#cbIn').value); };
  $('#cbSug').onclick = e => { const b = e.target.closest('button[data-cbq]'); if (b) cbSend(b.dataset.cbq); };
}

/* Zusammengelegte Seiten mit Reitern; die Einzelseiten bleiben als Reiter-Inhalt erhalten */
const SUB = {cockpit:P.cockpit, bericht:P.bericht, fracht:P.fracht, verkehr:P.verkehr, zoll:P.zoll, incoterms:P.incoterms, einkauf:P.einkauf, dispo:P.dispo, verkauf:P.verkauf, plan:P.plan};
const TABS = {
  ueberblick:[['cockpit','Cockpit'],['bericht','Management-Bericht']],
  transport:[['fracht','Frachtrechner'],['verkehr','Vergleich der Transportwege']],
  zoll:[['zoll','Zoll & Tarifierung'],['incoterms','Incoterms']],
  einkauf:[['einkauf','Staffel & Cashflow'],['dispo','Bestellung & Simulation']],
  verkauf:[['verkauf','Preis & Marge'],['plan','Verkaufsplan']],
};
const ALIAS = {plan:'verkauf', businesscase:'ueberblick', rechner:'ueberblick', compliance:'einkauf', cockpit:'ueberblick', bericht:'ueberblick', fracht:'transport', verkehr:'transport', incoterms:'zoll', dispo:'einkauf'};
Object.keys(TABS).forEach(pg => { P[pg] = () => {
  UI.tab = UI.tab || {}; let cur = UI.tab[pg]; if (!TABS[pg].some(x => x[0] === cur)) cur = TABS[pg][0][0];
  return `<div class="tabs" role="tablist">${TABS[pg].map(x => `<button type="button" role="tab" class="${x[0] === cur ? 'on' : ''}" aria-selected="${x[0] === cur}" data-tabpg="${pg}" data-tab="${x[0]}">${thrNum(pg, x[0]) ? `<i class="tn" title="Station im Pilot-Rundgang">${thrNum(pg, x[0])}</i>` : ''}${x[1]}</button>`).join('')}</div>` + SUB[cur]();
}; });
applyAlias();
render();
